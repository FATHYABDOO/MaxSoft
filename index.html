<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-card">
        <div class="card-header">
            <h2>تسجيل الدخول</h2>
            <p>أدخل بياناتك للمتابعة إلى حسابك</p>
        </div>

        <form id="loginForm">
            <!-- حقل البريد الإلكتروني -->
            <div class="input-group">
                <input type="email" id="email" required placeholder=" ">
                <label for="email">البريد الإلكتروني</label>
            </div>

            <!-- حقل كلمة المرور -->
            <div class="input-group">
                <input type="password" id="password" required placeholder=" ">
                <label for="password">كلمة المرور</label>
            </div>

            <!-- رسالة الخطأ اللحظية -->
            <div id="errorMessage" class="error-msg"></div>

            <!-- الخيارات السفلية -->
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox"> تذكرني
                </label>
                <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>
            </div>

            <!-- زر الدخول -->
            <button type="submit" class="submit-btn" id="submitBtn">دخول</button>
        </form>

        <div class="card-footer">
            <span>ليس لديك حساب؟ <a href="#">إنشاء حساب</a></span>
        </div>
    </div>

    <!-- كود الجافا سكريبت المدمج للتحقق -->
    <script src="script.js"></script>
</body>
</html>
